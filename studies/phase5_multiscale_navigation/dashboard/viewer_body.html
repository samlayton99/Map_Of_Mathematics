<!-- Body + logic for the MathMap results dashboard.
     Packaged into a single viewer.html by src/package_dashboard.py, which
     inlines charts.js and report.js so the shipped file has no siblings
     other than its data folder. -->
<header id="top">
  <div class="titlebar">
    <div>
      <h1>MathMap — ranking results suite</h1>
      <div class="sub" id="buildinfo"></div>
    </div>
    <div class="loadstate" id="loadstate"></div>
  </div>

  <div class="controls">
    <fieldset class="ctl exp">
      <legend>Experiment — <b>re-ranks</b></legend>
      <label>Universe
        <select id="c-universe"></select>
      </label>
      <span class="hint" id="universe-hint"></span>
    </fieldset>

    <fieldset class="ctl view">
      <legend>View / inclusion policy — <b>display only</b></legend>
      <label>Policy
        <select id="c-policy">
          <option value="topk">Top-k per proof</option>
          <option value="pct">Percentile per proof</option>
          <option value="global">Global score threshold</option>
          <option value="cluster">Cluster split (natural boundary)</option>
        </select>
      </label>
      <label class="p-topk">k <output id="o-k"></output>
        <input type="range" id="c-k" min="1" max="12" step="1" value="4">
      </label>
      <label class="p-pct">top <output id="o-pct"></output>
        <input type="range" id="c-pct" min="1" max="100" step="1" value="25">
      </label>
      <label class="p-global">global top <output id="o-q"></output>
        <input type="range" id="c-q" min="1" max="100" step="1" value="25">
      </label>
      <label>Lane
        <select id="c-lane"></select>
      </label>
      <span class="hint" id="lane-hint"></span>
    </fieldset>
  </div>
  <div class="statebar" id="statebar"></div>

  <nav class="tabs" id="maintabs"></nav>
  <nav class="tabs sub" id="rankchips"></nav>
</header>

<main id="main"></main>

<div id="picker" class="picker" hidden>
  <div class="picker-card">
    <h2>Load the data folder</h2>
    <p>This page could not read its data automatically. Pick the
      <code>data</code> folder that sits next to this file (or select all the
      <code>.json</code> files inside it).</p>
    <p>
      <input type="file" id="pick-dir" webkitdirectory directory multiple>
    </p>
    <p class="sub">or select files individually:</p>
    <p><input type="file" id="pick-files" multiple accept=".json,.js"></p>
    <p class="err" id="pick-err"></p>
  </div>
</div>

<script>
/* ============================== data loading ==============================
   Three mechanisms, tried in order, because a file:// page cannot fetch()
   adjacent files in Chrome:
     1. window.MAPDATA, set by data/all.js via a <script> tag. Works from
        file:// with no server, and is the normal path.
     2. fetch() of data/*.json, for when the folder is served over http.
     3. a File API picker, so the user can point at the folder by hand.
   ======================================================================== */
const GRADE_ORDER = ["KEY", "SUPPORT", "LEGIT_GLUE", "BAD_GLUE", "JUNK"];
const GRADE_COLOR = {KEY: "#2e7d32", SUPPORT: "#0288a6", LEGIT_GLUE: "#b58900",
                     BAD_GLUE: "#d2691e", JUNK: "#c0392b"};
const CAT_COLOR = {"machinery": "#c0392b", "logic-glue": "#d2691e",
                   "theorem": "#2456a4", "definition/construction": "#6a4fb5",
                   "constructor/recursor": "#7a7a7a"};
const CAT_ORDER = ["theorem", "definition/construction", "constructor/recursor",
                   "logic-glue", "machinery"];
const RANK_COLORS = ["#2456a4", "#2e7d32", "#b58900", "#c0392b", "#6a4fb5",
                     "#0288a6", "#d2691e", "#7a7a7a", "#8e44ad", "#16a085"];

// `var`, not `let`: a top-level `let` lives in the global lexical environment
// and is never reachable as `window.D`, which breaks both the headless render
// test and anyone poking at the page from the browser console.
var D = null;                      // {manifest, summary, definitions, vibe, sweep, rankings:{}}
var S = {universe: null, lane: "all", tab: "howto", ranking: null,
         vibeRanking: null, policy: "topk", k: 4, pct: 25, q: 25};

function pct(x, dp) {
  if (x === null || x === undefined || Number.isNaN(x)) return "—";
  return (100 * x).toFixed(dp === undefined ? 1 : dp) + "%";
}
function num(x, dp) {
  if (x === null || x === undefined || Number.isNaN(x)) return "—";
  return Number(x).toFixed(dp === undefined ? 3 : dp);
}
function intf(x) {
  if (x === null || x === undefined || Number.isNaN(x)) return "—";
  return Number(x).toLocaleString();
}
function ci(o, dp) {
  if (!o || o.value === null || o.value === undefined) return "—";
  const c = o.ci95;
  const base = pct(o.value, dp);
  if (!c || c[0] === null || c[1] === null) return base;
  return `${base} <span class="ci">[${pct(c[0], 0)}–${pct(c[1], 0)}]</span>`;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadData() {
  const ls = document.getElementById("loadstate");
  if (window.MAPDATA) {
    D = window.MAPDATA;
    if (window.MAPSWEEP && !D.sweep) D.sweep = window.MAPSWEEP;
    ls.textContent = "data: embedded bundle";
    return true;
  }
  try {
    const man = await (await fetch("data/manifest.json")).json();
    const get = async n => (await fetch("data/" + n)).json();
    const [summary, definitions, vibe] = await Promise.all(
      [get("summary.json"), get("definitions.json"), get("vibe.json")]);
    let sweep = null;
    try { sweep = await get("sweep.json"); } catch (e) { sweep = null; }
    const rankings = {};
    await Promise.all(man.rankings.map(async r => {
      rankings[r.name] = await get("ranking_" + r.name + ".json");
    }));
    D = {manifest: man, summary, definitions, vibe, sweep, rankings};
    ls.textContent = "data: fetched over http";
    return true;
  } catch (e) {
    return false;
  }
}

function wirePicker() {
  const box = document.getElementById("picker");
  box.hidden = false;
  const handle = async files => {
    const err = document.getElementById("pick-err");
    err.textContent = "";
    const byName = {};
    for (const f of files) byName[f.name] = f;
    const readText = f => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsText(f);
    });
    try {
      if (byName["all.js"]) {
        const txt = await readText(byName["all.js"]);
        // all.js is `window.MAPDATA = {...};` - take the object literal only
        const obj = txt.slice(txt.indexOf("=") + 1).trim().replace(/;\s*$/, "");
        D = JSON.parse(obj);
      } else if (byName["manifest.json"]) {
        const j = async n => JSON.parse(await readText(byName[n]));
        const man = await j("manifest.json");
        const rankings = {};
        for (const r of man.rankings) {
          const fn = "ranking_" + r.name + ".json";
          if (byName[fn]) rankings[r.name] = await j(fn);
        }
        D = {manifest: man, summary: await j("summary.json"),
             definitions: await j("definitions.json"),
             vibe: byName["vibe.json"] ? await j("vibe.json") : null,
             sweep: byName["sweep.json"] ? await j("sweep.json") : null,
             rankings};
      } else {
        err.textContent = "That folder has no all.js or manifest.json in it. " +
          "Pick the folder named `data`.";
        return;
      }
      if (byName["sweep.json"] && !D.sweep)
        D.sweep = JSON.parse(await readText(byName["sweep.json"]));
      box.hidden = true;
      document.getElementById("loadstate").textContent = "data: loaded by hand";
      boot();
    } catch (ex) {
      err.textContent = "Could not read those files: " + ex.message;
    }
  };
  document.getElementById("pick-dir").addEventListener("change",
    e => handle(e.target.files));
  document.getElementById("pick-files").addEventListener("change",
    e => handle(e.target.files));
}

/* ============================== state / chrome ========================== */
function currentExp(rk) {
  const r = D.rankings[rk || S.ranking];
  return r ? r.experiments[S.universe] : null;
}
function laneOf() { return S.lane; }
function viewKey() { return laneOf() + "|" + nearestK(); }
function nearestK() {
  const ks = D.manifest.ks || [1, 2, 4, 8];
  let best = ks[0];
  for (const k of ks) if (Math.abs(k - S.k) < Math.abs(best - S.k)) best = k;
  return best;
}
function policyLabel() {
  if (S.policy === "topk") return `top ${S.k} per proof`;
  if (S.policy === "pct") return `top ${S.pct}% per proof`;
  if (S.policy === "global") return `global top ${S.q}% by score`;
  return "cluster split (natural boundary)";
}

function buildChrome() {
  const m = D.manifest;
  document.getElementById("buildinfo").innerHTML =
    `built ${esc(m.built)} · git ${esc(m.git)} · ` +
    `${intf(m.n_labelled_proofs)} graded proofs · ${intf(m.n_labels)} graded ` +
    `candidates · ${m.n_rater_files} rater passes`;

  const u = document.getElementById("c-universe");
  u.innerHTML = "";
  for (const un of m.universes) {
    const o = el("option"); o.value = un;
    o.textContent = un + (un === m.reference_universe ? "  (reference)" : "");
    u.appendChild(o);
  }
  S.universe = S.universe || m.reference_universe;
  u.value = S.universe;

  const l = document.getElementById("c-lane");
  l.innerHTML = "";
  for (const ln of m.lanes) {
    const o = el("option"); o.value = ln; o.textContent = ln;
    l.appendChild(o);
  }
  l.value = S.lane;

  const tabs = [["howto", "How to read this"], ["summary", "Summary"],
                ["vibe", "Vibe check"]];
  const nav = document.getElementById("maintabs");
  nav.innerHTML = "";
  for (const [id, label] of tabs) {
    const b = el("button", "tab" + (S.tab === id ? " on" : ""), esc(label));
    b.onclick = () => { S.tab = id; render(); };
    nav.appendChild(b);
  }
  const chips = document.getElementById("rankchips");
  chips.innerHTML = "";
  chips.appendChild(el("span", "chiplabel", "Ranking detail:"));
  const cands = m.rankings.filter(r => r.family === "candidate");
  const bases = m.rankings.filter(r => r.family !== "candidate");
  for (const grp of [cands, bases]) {
    for (const r of grp) {
      const on = S.tab === "ranking" && S.ranking === r.name;
      const b = el("button", "chip " + r.family + (on ? " on" : ""),
                   esc(r.name));
      b.title = r.doc || "";
      b.onclick = () => { S.tab = "ranking"; S.ranking = r.name; render(); };
      chips.appendChild(b);
    }
    if (grp === cands && bases.length)
      chips.appendChild(el("span", "chipsep", "baselines / oracle"));
  }
  document.getElementById("universe-hint").textContent =
    (D.definitions.universes[S.universe] || "").split(".")[0];
  document.getElementById("lane-hint").textContent =
    (D.definitions.lanes[S.lane] || "").split(".")[0];
  for (const p of ["topk", "pct", "global"])
    document.querySelectorAll(".p-" + p).forEach(
      e => e.style.display = (S.policy === p ? "" : "none"));
  // push state INTO the widgets too, otherwise a restored session shows the
  // right numbers in the readouts while the sliders sit at their defaults
  document.getElementById("c-policy").value = S.policy;
  document.getElementById("c-k").value = S.k;
  document.getElementById("c-pct").value = S.pct;
  document.getElementById("c-q").value = S.q;
  document.getElementById("o-k").textContent = S.k;
  document.getElementById("o-pct").textContent = S.pct + "%";
  document.getElementById("o-q").textContent = S.q + "%";
  document.getElementById("statebar").innerHTML =
    `<span class="pill exp">experiment: universe <b>${esc(S.universe)}</b></span>` +
    `<span class="pill view">view: <b>${esc(policyLabel())}</b> · lane ` +
    `<b>${esc(S.lane)}</b></span>` +
    (S.policy === "topk" && nearestK() !== S.k
      ? `<span class="pill warn">metric panels use nearest precomputed ` +
        `k=${nearestK()}</span>` : "");
}

function wireControls() {
  const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
  on("c-universe", "change", e => { S.universe = e.target.value; render(); });
  on("c-lane", "change", e => { S.lane = e.target.value; render(); });
  on("c-policy", "change", e => { S.policy = e.target.value; render(); });
  on("c-k", "input", e => { S.k = +e.target.value; render(); });
  on("c-pct", "input", e => { S.pct = +e.target.value; render(); });
  on("c-q", "input", e => { S.q = +e.target.value; render(); });
}

/* ================================ render ================================ */
function render() {
  buildChrome();
  saveState();
  const m = document.getElementById("main");
  m.innerHTML = "";
  try {
    if (S.tab === "howto") renderHowTo(m);
    else if (S.tab === "summary") renderSummary(m);
    else if (S.tab === "vibe") renderVibe(m);
    else renderRanking(m);
  } catch (e) {
    m.appendChild(el("div", "card err",
      "<h2>Render error</h2><pre>" + esc(e.stack || e.message) + "</pre>"));
  }
  if (window.scrollTo) { try { window.scrollTo({top: 0}); } catch (e) {} }
}

function section(parent, title, kind, note) {
  const c = el("section", "card " + (kind || ""));
  const h = el("div", "cardhead");
  h.appendChild(el("h2", null, esc(title)));
  if (kind === "invariant")
    h.appendChild(el("span", "badge inv",
      "INVARIANT — not moved by the view controls"));
  if (kind === "slice")
    h.appendChild(el("span", "badge sl",
      "CURRENT SLICE — moves with the view controls"));
  c.appendChild(h);
  if (note) c.appendChild(el("p", "note", note));
  parent.appendChild(c);
  return c;
}

function table(parent, cols, rows, cls) {
  const t = el("table", cls);
  const th = el("tr");
  for (const c of cols) th.appendChild(el("th", null, c));
  t.appendChild(el("thead")).appendChild(th);
  const tb = el("tbody");
  for (const r of rows) {
    const tr = el("tr");
    if (r._cls) tr.className = r._cls;
    const cells = r._cells || r;
    for (const c of cells) tr.appendChild(el("td", null, c));
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  parent.appendChild(t);
  return t;
}

function chartBox(parent, title, sub) {
  const w = el("div", "chart");
  if (title) w.appendChild(el("h3", null, esc(title)));
  if (sub) w.appendChild(el("p", "note", esc(sub)));
  const host = el("div", "charthost");
  w.appendChild(host);
  parent.appendChild(w);
  return host;
}

/* ------------------------------- HOW TO -------------------------------- */
function renderHowTo(m) {
  const d = D.definitions;
  let c = section(m, "What you are looking at");
  c.appendChild(el("p", null,
    "This suite compares <b>ranking algorithms</b>: functions that order the " +
    "citations inside a Mathlib proof by how <i>key</i> each one is to that " +
    "proof. Every tab answers one of three separate questions, and the whole " +
    "design exists to stop them being confused."));
  table(c, ["question", "what answers it", "which numbers"], [
    ["Is the ranking good?", "graded rater labels on 180 proofs, plus " +
     "full-corpus structural composition", "<code>Semantic*</code>, " +
     "<code>Role*</code>"],
    ["Does it agree with the author?", "elaborator-recovered citations the " +
     "human wrote", "<code>Source*</code> — <b>not keyness</b>"],
    ["What does the current view contain?", "the slice the controls select " +
     "right now", "<code>View*</code>, <code>Graph*</code>"],
  ]);
  c.appendChild(el("p", "warn-box",
    "<b>The single rule of this dashboard.</b> The <span class='pill exp'>" +
    "experiment</span> control (universe) changes the candidate set and " +
    "therefore genuinely re-ranks. The <span class='pill view'>view</span> " +
    "controls (policy, k, lane) only choose what is displayed: they filter " +
    "an already-ranked list and can never change a ranking-quality number. " +
    "Panels are badged accordingly, so you always know which you are reading."));

  c = section(m, "How a run is built");
  const p = d.how_a_run_is_built;
  const ol = el("ol");
  for (const s of p.pipeline) ol.appendChild(el("li", null, esc(s)));
  c.appendChild(ol);
  c.appendChild(el("p", "note", "<b>Reproducing a ranking.</b> " +
    esc(p.reproducing_a_ranking)));

  c = section(m, "Every ranking, exactly as constructed");
  c.appendChild(el("p", "note",
    "The literal source of each scoring function. Together with the signal " +
    "definitions below and <code>np.lexsort</code>, this reproduces every " +
    "ranking in the suite. No hidden constants, no name lists, no learned " +
    "parameters."));
  for (const r of D.manifest.rankings) {
    const spec = D.rankings[r.name] && D.rankings[r.name].spec;
    const det = el("details");
    det.appendChild(el("summary", null,
      `<code>${esc(r.name)}</code> <span class="fam ${esc(r.family)}">` +
      `${esc(r.family)}</span> — ${esc(r.doc || "")}`));
    if (spec) {
      det.appendChild(el("pre", "code", esc(spec.source)));
      det.appendChild(el("p", "note", esc(spec.sort_semantics)));
    }
    c.appendChild(det);
  }

  c = section(m, "Signals a ranking may read");
  table(c, ["signal", "definition"],
    Object.entries(d.signals).map(([k, v]) => [`<code>${esc(k)}</code>`, esc(v)]));

  c = section(m, "Candidate universes (experiment control)");
  table(c, ["universe", "definition"],
    Object.entries(d.universes).filter(([k]) => k[0] !== "_")
      .map(([k, v]) => [`<b>${esc(k)}</b>`, esc(v)]));
  c.appendChild(el("p", "note", esc(d.universes._note)));

  c = section(m, "Lanes and policies (view controls)");
  table(c, ["lane", "definition"],
    Object.entries(d.lanes).map(([k, v]) => [`<b>${esc(k)}</b>`, esc(v)]));
  table(c, ["policy", "definition"], [
    ["<b>Top-k per proof</b>", "The k highest-ranked visible citations of " +
     "every proof. Blunt: a proof with one real move and a proof with five " +
     "get the same budget."],
    ["<b>Percentile per proof</b>", "The top p% of each proof's visible " +
     "citations, at least one. Scales the budget with proof size."],
    ["<b>Global score threshold</b>", "The globally top-scoring q% of all " +
     "citations, compared ACROSS proofs. <b>Caveat: cross-proof score " +
     "comparability has never been validated in this program.</b> Treat as " +
     "exploratory."],
    ["<b>Cluster split</b>", "A per-proof adaptive cut at the natural " +
     "boundary in the score sequence, so each proof gets the budget its own " +
     "score distribution justifies. This is the honest version of " +
     "'plumbing is a continuum'."],
  ]);

  c = section(m, "Metric families");
  table(c, ["family", "meaning"],
    Object.entries(d.metric_families).map(([k, v]) =>
      [`<code>${esc(k)}</code>`, esc(v)]));

  c = section(m, "The 0–4 grade");
  table(c, ["grade", "meaning"],
    Object.entries(d.grades).map(([k, v]) => [`<b>${esc(k)}</b>`, esc(v)]));
  c.appendChild(el("p", "note",
    "Raters saw every candidate of a proof in random order, never saw any " +
    "ranking, and graded all of them. One annotation therefore scores every " +
    "ranking present and future with no anchoring."));

  c = section(m, "Headline metrics");
  table(c, ["metric", "definition"],
    Object.entries(d.headline_metrics).map(([k, v]) =>
      [`<code>${esc(k)}</code>`, esc(v)]));

  c = section(m, "Caveats you must carry", "warn");
  const ul = el("ul");
  for (const s of d.cautions) ul.appendChild(el("li", null, esc(s)));
  c.appendChild(ul);
}

/* ------------------------------- SUMMARY ------------------------------- */
function rankRows() {
  const out = [];
  for (const [nm, r] of Object.entries(D.summary.rankings)) {
    const u = r.by_universe[S.universe];
    if (u) out.push({name: nm, family: r.family, doc: r.doc, u});
  }
  out.sort((a, b) => (a.family !== b.family)
    ? (a.family === "candidate" ? -1 : 1)
    : ((b.u.SemanticKeyMoveAt1 ? b.u.SemanticKeyMoveAt1.value : 0) -
       (a.u.SemanticKeyMoveAt1 ? a.u.SemanticKeyMoveAt1.value : 0)));
  return out;
}

function renderSummary(m) {
  const rows = rankRows();
  let c = section(m, "Ranking quality — all rankings, universe " + S.universe,
                  "invariant",
                  "Graded rater labels on 180 proofs. Every figure carries its " +
                  "95% Wilson interval; differences smaller than the intervals " +
                  "are not real. SourceHit is shown only for contrast and is " +
                  "an authorship-alignment diagnostic, never keyness.");
  table(c, ["ranking", "family", "KeyMove@1", "Bad@1 (glue+junk)",
            "LegitGlue@1", "mean grade@1", "KeyRecall@4", "glue@1 (structural)",
            "SourceHit@1 (not keyness)"],
    rows.map(r => ({
      _cls: r.family === "candidate" ? "cand" : "base",
      _cells: [
        `<button class="link" onclick="S.tab='ranking';S.ranking='${esc(r.name)}';render()">${esc(r.name)}</button>`,
        `<span class="fam ${esc(r.family)}">${esc(r.family)}</span>`,
        ci(r.u.SemanticKeyMoveAt1), ci(r.u.SemanticBadAt1),
        ci(r.u.SemanticLegitGlueAt1), num(r.u.SemanticMeanGradeAt1, 2),
        pct(r.u["SemanticKeyMoveRecall@4"]), pct(r.u.RoleGlueAt1),
        pct(r.u["SourceHit@1"])]})));

  const cands = rows.filter(r => r.family === "candidate");
  let host = chartBox(c, "Key move at rank 1 vs failure at rank 1",
    "Green = rank-1 item graded KEY. Red = graded BAD_GLUE or JUNK. Whiskers are 95% intervals.");
  Charts.grouped(host, {
    groups: rows.map(r => r.name),
    series: [
      {label: "KeyMove@1", color: GRADE_COLOR.KEY,
       values: rows.map(r => r.u.SemanticKeyMoveAt1 && r.u.SemanticKeyMoveAt1.value)},
      {label: "Bad@1", color: GRADE_COLOR.JUNK,
       values: rows.map(r => r.u.SemanticBadAt1 && r.u.SemanticBadAt1.value)},
    ], yLabel: "share of proofs", yFormat: v => pct(v, 0), yMax: 1});

  host = chartBox(c, "What is sitting at rank 1, graded",
    "The scorecard: for each ranking, the composition of its top-ranked item across the 180 graded proofs.");
  Charts.stacked(host, {
    rows: rows.map(r => ({label: r.name, values: r.u.grade_at_1 || {}})),
    parts: GRADE_ORDER.map(g => ({name: g, color: GRADE_COLOR[g]})),
    yFormat: v => pct(v, 0), legend: true});

  host = chartBox(c, "Key-move recall as the view deepens",
    "Of all candidates graded KEY in a proof, the share appearing in the top k.");
  Charts.lines(host, {
    series: rows.map((r, i) => ({
      label: r.name, color: RANK_COLORS[i % RANK_COLORS.length],
      dashed: r.family !== "candidate",
      points: (D.manifest.ks || [1, 2, 4, 8]).map(

  c = section(m, "Legitimate glue at rank 1, by target depth", "invariant",
    "The counterpart. High values near the foundations are CORRECT: at " +
    "shallow depth, assembling equalities genuinely is the mathematics.");
  host = chartBox(c, null, null);
  Charts.heat(host, {
    rows: rows.map(r => r.name), cols: bands,
    values: rows.map(r => bands.map(b => {

  // ---- rater / classifier panels ---------------------------------------

  c = section(m, "The label set itself");

    ["graded proofs", intf(meta.n_proofs_labelled)],

    ["rater passes", intf(meta.n_rater_files)],
    ["triple-rated candidates (agreement set)", intf(ag.n_overlap_candidates)],
    ["exact agreement", pct(ag.ExactAgreement)],
    ["adjacent agreement (within one grade)", pct(ag.AdjacentAgreement)],
    ["quadratic-weighted kappa", num(ag.QuadraticWeightedKappa)],
    ["proofs where a key move is MISSING from the candidates",
     pct(meta.missing_key_rate)],
  ]);
  const gd = (L.glue_classifier || {}).grade_distribution;
  if (gd) {
    c.appendChild(el("h3", null, "Grade distribution over all graded candidates"));
    host = chartBox(c, null, null);
    Charts.bar(host, {horizontal: true, yFormat: intf,
      series: GRADE_ORDER.map(g => ({label: g, value: gd[g],
                                     color: GRADE_COLOR[g]}))});
  }

  const gc = L.glue_classifier;
  if (gc) {
    c = section(m, "How good is our own glue flag?", "invariant",
      "Our structural `inc_glue` claims a candidate is plumbing. Raters grade " +
      "plumbing 2 (legitimate here) or 1 (carries no idea); 0 is junk.");
    table(c, ["metric", "value", "n", "reading"], [
      ["GluePrecision", ci(gc.GluePrecision), intf(gc.GluePrecision.n),
       "of what we call glue, the share raters agree is plumbing-shaped"],
      ["GlueRecall", ci(gc.GlueRecall), intf(gc.GlueRecall.n),
       "of what raters call plumbing, the share we catch"],
      ["KeyMovesFlaggedAsGlue", ci(gc.KeyMovesFlaggedAsGlue),
       intf(gc.KeyMovesFlaggedAsGlue.n),
       "<b>the cost of the glue channel</b> — key moves it would demote"],
    ]);
    table(c, ["rater grade", "n", "our flag says glue", "our flag says machinery"],
      GRADE_ORDER.map(g => {
        const r = gc.confusion_by_grade[g] || {};
        return [`<b style="color:${GRADE_COLOR[g]}">${g}</b>`, intf(r.n),
                `${intf(r.system_glue)} <span class="ci">(${pct(r.n ? r.system_glue / r.n : null, 0)})</span>`,
                intf(r.system_machinery)];
      }));
  }

  // ---- coverage ---------------------------------------------------------
  const cov = D.summary.coverage && D.summary.coverage[S.universe];
  if (cov) {
    c = section(m, "Candidate coverage — universe " + S.universe, "invariant",
      "What share of the citations humans actually wrote is present in this " +
      "universe AT ALL. A ranking cannot be blamed for a candidate never " +
      "offered to it, so this bounds every Source* number above.");
    table(c, ["kind", "written", "in record", "in universe", "coverage"],
      Object.entries(cov).map(([k, v]) =>
        [k === "ALL" ? "<b>ALL</b>" : esc(k), intf(v.written),
         intf(v.in_record), intf(v.in_universe),
         pct(v.CoverageInUniverse)]));
  }
}

/* Adapter for sweep.json.
   It stores `series["<universe>|<ranking>"].points` as an ARRAY of level
   objects that already carry their own id/label/kind/param, and reports
   ViewKeyRetained / ViewPrecisionGraded as {value,k,n} objects rather than
   bare numbers. Everything downstream wants a level-id -> flat-metrics map,
   so normalise once here instead of special-casing at each call site. */
function sweepLevels() {
  const sw = D.sweep;
  if (!sw) return [];
  return (sw.levels || []).slice();
}
function unwrap(v) {
  return (v && typeof v === "object" && "value" in v) ? v.value : v;
}
function sweepCurve(rk) {
  const sw = D.sweep;
  if (!sw) return null;
  const s = (sw.series || {})[S.universe + "|" + rk];
  if (!s || !s.points) return null;
  const out = {};
  for (const p of s.points) {
    const flat = {};
    for (const k of Object.keys(p)) flat[k] = unwrap(p[k]);
    flat._raw = p;
    out[p.id] = flat;
  }
  if (s.cluster) {
    const cl = sweepLevels().find(l => l.kind === "cluster");
    const flat = {};
    for (const k of Object.keys(s.cluster)) flat[k] = unwrap(s.cluster[k]);
    flat._raw = s.cluster;
    out[cl ? cl.id : "cluster"] = flat;
  }
  return out;
}
function currentSweepX() {
  // where the current policy sits on the size-fraction axis
  const cur = sweepCurve(S.ranking || rankRows()[0].name);
  if (!cur) return null;
  const lv = sweepLevels();
  let want = null;
  if (S.policy === "topk") want = l => l.kind === "topk" && +l.param === nearestK();
  else if (S.policy === "pct") want = l => l.kind === "percentile" &&
    Math.abs(+l.param * 100 - S.pct) < 3;
  else if (S.policy === "cluster") want = l => l.kind === "cluster";
  else return null;
  const hit = lv.find(want);
  if (!hit) return null;
  const v = cur[hit.id];
  return v ? {x: v.ViewSizeFraction, label: hit.label} : null;
}

function renderSweep(m, rows) {
  const c = section(m, "The slider curve — what happens as the view closes",
    "slice",
    "Every point is one inclusion policy applied to the whole corpus, from " +
    "fully open (100% of candidates) to most restrictive. The vertical rule " +
    "marks where your current policy sits. Computed at lane = all.");
  const lv = sweepLevels();
  const vline = currentSweepX();
  const mk = (metric, title, sub, fmt) => {
    const host = chartBox(c, title, sub);
    Charts.lines(host, {
      xType: "log", xLabel: "share of all candidates admitted (log)",
      yLabel: title, yFormat: fmt || (v => pct(v, 0)), vline,
      series: rows.map((r, i) => {
        const cur = sweepCurve(r.name);
        if (!cur) return null;
        const pts = lv.map(l => cur[l.id])
          .filter(Boolean)
          .map(v => ({x: v.ViewSizeFraction, y: v[metric]}))
          .filter(p => p.x > 0)
          .sort((a, b) => a.x - b.x);
        return {label: r.name, color: RANK_COLORS[i % RANK_COLORS.length],
                dashed: r.family !== "candidate", points: pts};
      }).filter(Boolean)});
  };
  mk("ViewKeyRetained", "Key moves retained",
     "The metric that matters: as you close the view, how many of the " +
     "rater-graded KEY moves survive? A good ranking holds this flat while " +
     "the view shrinks.");
  mk("ViewPrecisionGraded", "Precision of the view",
     "Share of admitted graded candidates that raters graded SUPPORT or KEY. " +
     "Rises as the view closes if the ranking is working.");
  mk("ViewGlueShare", "Structural glue share of the view",
     "What fraction of what you are looking at our classifier calls plumbing.");
  mk("GraphGiantFraction", "Giant component of the projected graph",
     "Connectivity of the map you would actually navigate at this setting.");

  const clusterPts = rows.map(r => {
    const cur = sweepCurve(r.name);
    const cl = lv.find(l => l.kind === "cluster");
    return (cur && cl && cur[cl.id]) ? {name: r.name, v: cur[cl.id]} : null;
  }).filter(Boolean);
  if (clusterPts.length) {
    c.appendChild(el("h3", null, "Cluster split — the natural boundary"));
    c.appendChild(el("p", "note",
      "A per-proof adaptive cut instead of one global budget. Compare its " +
      "size fraction and key retention against the fixed-k points above: it " +
      "earns its place only if it holds more key moves at the same size."));
    table(c, ["ranking", "size fraction", "key retained", "precision",
              "mean grade", "components"],
      clusterPts.map(p => [esc(p.name), pct(p.v.ViewSizeFraction, 2),
        pct(p.v.ViewKeyRetained), pct(p.v.ViewPrecisionGraded),
        num(p.v.ViewMeanGrade, 2), intf(p.v.GraphComponents)]));
  }
}

/* ------------------------------- RANKING ------------------------------- */
function renderRanking(m) {
  const rk = S.ranking;
  const data = D.rankings[rk];
  if (!data) { section(m, "No data for " + rk); return; }
  const exp = data.experiments[S.universe];
  const rq = exp.ranking_quality;
  const sem = rq.semantic, comp = rq.composition, src = rq.source;
  const meta = D.summary.rankings[rk];

  let c = section(m, rk);
  c.appendChild(el("p", null, esc(data.spec.doc)));
  const bar = el("div", "actions");
  const btn = el("button", "primary", "Export this report (.md)");
  btn.onclick = () => {
    const text = Report.build({ranking: rk, data, summary: D.summary,
      definitions: D.definitions, manifest: D.manifest, vibe: D.vibe,
      sweep: D.sweep, state: {universe: S.universe, lane: S.lane, k: nearestK(),
                              policy: policyLabel()}});
    Report.download(Report.filename({ranking: rk, state: {universe: S.universe}}),
                    text);
  };
  bar.appendChild(btn);
  c.appendChild(bar);
  table(c, ["property", "value"], [
    ["family", `<span class="fam ${esc(data.family)}">${esc(data.family)}</span>`],
    ["universe (experiment)", esc(S.universe)],
    ["candidates ranked", intf(exp.n_candidates)],
    ["proofs", intf(exp.n_proofs)],
    ["proofs with author provenance", intf(exp.n_proofs_with_provenance)],
    ["graded proofs scored", intf(sem.n_proofs_scored)],
    ["distinct score levels", intf(rq.ties.distinct_levels)],
    ["fraction of pairs tied", pct(rq.ties.approx_frac_pairs_tied, 2)],
  ]);
  const det = el("details");
  det.appendChild(el("summary", null, "How this ranking is constructed"));
  det.appendChild(el("pre", "code", esc(data.spec.source)));
  det.appendChild(el("p", "note", esc(data.spec.sort_semantics)));
  c.appendChild(det);

  // ---- ranking quality --------------------------------------------------
  c = section(m, "Scorecard at rank 1", "invariant",
    `What the top-ranked citation actually is, graded by raters over ` +
    `${sem.n_proofs_scored} proofs. This is the headline.`);
  let host = chartBox(c, null, null);
  Charts.stacked(host, {
    rows: [{label: rk, values: sem.grade_at_1}],
    parts: GRADE_ORDER.map(g => ({name: g, color: GRADE_COLOR[g]})),
    yFormat: v => pct(v, 0), legend: true});
  table(c, ["metric", "value (95% CI)", "k / n", "meaning"], [
    ["KeyMove@1", ci(sem.SemanticKeyMoveAt1),
     `${sem.SemanticKeyMoveAt1.k}/${sem.SemanticKeyMoveAt1.n}`,
     "rank-1 is a core move"],
    ["Key or Support@1", ci(sem.SemanticKeyOrSupportAt1),
     `${sem.SemanticKeyOrSupportAt1.k}/${sem.SemanticKeyOrSupportAt1.n}`,
     "rank-1 is real mathematics"],
    ["LegitGlue@1", ci(sem.SemanticLegitGlueAt1),
     `${sem.SemanticLegitGlueAt1.k}/${sem.SemanticLegitGlueAt1.n}`,
     "rank-1 is plumbing that IS the content here — <b>not a failure</b>"],
    ["BadGlue@1", ci(sem.SemanticBadGlueAt1),
     `${sem.SemanticBadGlueAt1.k}/${sem.SemanticBadGlueAt1.n}`,
     "rank-1 is plumbing carrying no idea — <b>a real failure</b>"],
    ["Junk@1", ci(sem.SemanticJunkAt1),
     `${sem.SemanticJunkAt1.k}/${sem.SemanticJunkAt1.n}`,
     "rank-1 is machinery noise"],
    ["<b>Bad@1</b>", ci(sem.SemanticBadAt1),
     `${sem.SemanticBadAt1.k}/${sem.SemanticBadAt1.n}`,
     "<b>the headline failure rate</b>"],
    ["mean grade@1", num(sem.SemanticMeanGradeAt1, 2), "—", "0–4 scale"],
  ]);

  c = section(m, "Key-move recall", "invariant",
    "Of all candidates graded KEY in a proof, the share appearing in the top k.");
  const ks = D.manifest.ks || [1, 2, 4, 8];
  table(c, ["k"].concat(ks.map(String)), [
    ["KeyMoveRecall@k"].concat(ks.map(k => pct(sem["SemanticKeyMoveRecall@" + k]))),
    ["Key-or-Support recall@k"].concat(
      ks.map(k => pct(sem["SemanticKeyOrSupportRecall@" + k]))),
  ]);
  host = chartBox(c, null, null);
  Charts.lines(host, {xTicks: ks, xLabel: "k", yLabel: "recall",
    yFormat: v => pct(v, 0),
    series: [
      {label: "key moves", color: GRADE_COLOR.KEY,
       points: ks.map(k => ({x: k, y: sem["SemanticKeyMoveRecall@" + k]}))},
      {label: "key or support", color: GRADE_COLOR.SUPPORT,
       points: ks.map(k => ({x: k, y: sem["SemanticKeyOrSupportRecall@" + k]}))},
    ]});

  c = section(m, "By target depth", "invariant",
    "The breakdown that matters most: glue near the foundations is often " +
    "legitimate, and this table is where you can see that directly. n per " +
    "band is small — read the columns, not the decimals.");
  const bands = Object.keys(sem.by_target_depth);
  table(c, ["band", "n", "KeyMove@1", "LegitGlue@1", "BadGlue@1", "Junk@1",
            "Bad@1", "mean grade", "KeyRecall@4"],
    bands.map(b => {
      const v = sem.by_target_depth[b];
      return [`<b>${esc(b)}</b>`, intf(v.n), pct(v.SemanticKeyMoveAt1),
              pct(v.SemanticLegitGlueAt1), pct(v.SemanticBadGlueAt1),
              pct(v.SemanticJunkAt1), pct(v.SemanticBadAt1),
              num(v.SemanticMeanGradeAt1, 2),
              pct(v["SemanticKeyMoveRecall@4"])];
    }));
  host = chartBox(c, "Grade composition at rank 1, by depth", null);
  Charts.stacked(host, {
    rows: bands.map(b => ({label: b + " (n=" + sem.by_target_depth[b].n + ")",
                           values: sem.by_target_depth[b].grade_at_1})),
    parts: GRADE_ORDER.map(g => ({name: g, color: GRADE_COLOR[g]})),
    yFormat: v => pct(v, 0), legend: true});

  c = section(m, "Structural composition — full corpus", "invariant",
    "Our own classifier over every proof in the library, not just the graded " +
    "180. This channel can say 'there is glue at rank 1'; it CANNOT say that " +
    "glue is wrong. Compare it against the graded table above: the gap " +
    "between them is exactly the legitimate glue.");
  table(c, ["metric", "value"], [
    ["RoleGlueAt1 (structural)", pct(comp.RoleGlueAt1)],
    ["Bad@1 (graded)", ci(sem.SemanticBadAt1)],
    ["theorem at rank 1", pct(comp.RoleTheoremAt1)],
    ["definition/construction at rank 1", pct(comp.RoleDefinitionAt1)],
    ["machinery at rank 1", pct(comp.RoleMachineryAt1)],
    ["proofs covered", intf(comp.n_proofs)],
  ]);
  const cbands = Object.keys(comp.at_k["1"].by_target_depth);
  host = chartBox(c, "What our classifier sees at rank 1, by depth", null);
  Charts.stacked(host, {
    rows: cbands.map(b => ({
      label: b + " (n=" + intf(comp.at_k["1"].by_target_depth[b].n) + ")",
      values: comp.at_k["1"].by_target_depth[b]})),
    parts: CAT_ORDER.map(g => ({name: g, color: CAT_COLOR[g]})),
    yFormat: v => pct(v, 0), legend: true});

  // ---- what it got wrong -------------------------------------------------
  c = section(m, "What it got wrong, named", "invariant",
    "The most actionable section. Left: candidates raters graded KEY that " +
    "this ranking buried below rank 4. Right: candidates raters graded " +
    "BAD_GLUE or JUNK that it promoted to rank 1.");
  c.appendChild(el("h3", null,
    `Buried key moves (${sem.worst_misses.length} shown)`));
  if (sem.worst_misses.length)
    table(c, ["theorem", "depth", "buried declaration", "rank", "of"],
      sem.worst_misses.map(r => [`<code>${esc(r.theorem)}</code>`,
        intf(r.target_depth), `<code>${esc(r.name)}</code>`,
        `<b>${r.rank}</b>`, r.of]), "small");
  else c.appendChild(el("p", "note", "None — every graded KEY move ranks in the top 4."));
  c.appendChild(el("h3", null,
    `Wrongly promoted to rank 1 (${sem.false_promotions.length} shown)`));
  if (sem.false_promotions.length)
    table(c, ["theorem", "depth", "promoted declaration", "grade",
              "our glue flag", "best available"],
      sem.false_promotions.map(r => [`<code>${esc(r.theorem)}</code>`,
        intf(r.target_depth), `<code>${esc(r.name)}</code>`,
        `<b style="color:${GRADE_COLOR[r.grade_name]}">${esc(r.grade_name)}</b>`,
        r.system_says_glue ? "flagged" : "<b>missed</b>",
        esc(GRADE_ORDER[4 - r.best_available_grade] || "—")]), "small");
  else c.appendChild(el("p", "note", "None."));

  // ---- source ------------------------------------------------------------
  c = section(m, "Source agreement — NOT keyness", "invariant",
    "Agreement with the identifiers the human author wrote. The semantic " +
    "panel measured the SourceOracle itself at only 0.619 keyness, beaten by " +
    "four candidate rankings, so this family is an authorship diagnostic. A " +
    "ranking may not be promoted on it. Measured on a nearly disjoint sample " +
    "from the graded set — do not difference the two.");
  table(c, ["metric", "value"], [["SourceHit@1", pct(src["SourceHit@1"])],
    ["SourceMRR", num(src.SourceMRR)]].concat(
      ks.map(k => ["SourceRecall@" + k, pct(src["SourceRecall@" + k])])).concat(
      [["proofs", intf(src.n_proofs)]]));
  table(c, ["band", "n", "SourceHit@1", "SourceRecall@4"],
    Object.entries(src.by_target_depth).map(([b, v]) =>
      [`<b>${esc(b)}</b>`, intf(v.n), pct(v["SourceHit@1"]),
       pct(v["SourceRecall@4"])]));

  // ---- current view ------------------------------------------------------
  renderViewPanel(m, data, rk);

  // ---- sweep for this ranking -------------------------------------------
  if (D.sweep) {
    const cur = sweepCurve(rk);
    if (cur) {
      const cc = section(m, "This ranking's slider curve", "slice",
        "How this ranking alone behaves as the view closes. Vertical rule = " +
        "your current policy.");
      const lv = sweepLevels();
      const pts = met => lv.map(l => cur[l.id]).filter(Boolean)
        .map(v => ({x: v.ViewSizeFraction, y: v[met]}))
        .filter(p => p.x > 0).sort((a, b) => a.x - b.x);
      const host2 = chartBox(cc, null, null);
      Charts.lines(host2, {xType: "log", vline: currentSweepX(),
        xLabel: "share of candidates admitted (log)", yLabel: "share",
        yFormat: v => pct(v, 0),
        series: [
          {label: "key moves retained", color: GRADE_COLOR.KEY, points: pts("ViewKeyRetained")},
          {label: "precision of view", color: GRADE_COLOR.SUPPORT, points: pts("ViewPrecisionGraded")},
          {label: "structural glue share", color: GRADE_COLOR.BAD_GLUE, points: pts("ViewGlueShare")},
          {label: "giant component", color: CAT_COLOR.theorem, points: pts("GraphGiantFraction")},
        ]});
    }
  }

  // ---- comparison --------------------------------------------------------
  const rows = rankRows();
  c = section(m, "Compared with every other ranking", "invariant",
    "Same universe, same graded proofs. This ranking is highlighted.");
  table(c, ["ranking", "KeyMove@1", "Bad@1", "LegitGlue@1", "mean grade@1",
            "KeyRecall@4", "glue@1", "SourceHit@1"],
    rows.map(r => ({
      _cls: r.name === rk ? "here" : (r.family === "candidate" ? "cand" : "base"),
      _cells: [
        (r.name === rk ? "<b>" + esc(r.name) + "</b> ←" : esc(r.name)),
        ci(r.u.SemanticKeyMoveAt1), ci(r.u.SemanticBadAt1),
        ci(r.u.SemanticLegitGlueAt1), num(r.u.SemanticMeanGradeAt1, 2),
        pct(r.u["SemanticKeyMoveRecall@4"]), pct(r.u.RoleGlueAt1),
        pct(r.u["SourceHit@1"])]})));
  const me = rows.findIndex(r => r.name === rk);
  const mine = rows[me];
  const top = rows[0];
  if (mine && top) {
    const overlap = mine.u.SemanticKeyMoveAt1 && top.u.SemanticKeyMoveAt1 &&
      mine.u.SemanticKeyMoveAt1.ci95[1] >= top.u.SemanticKeyMoveAt1.ci95[0];
    c.appendChild(el("p", "note",
      `Ranked <b>${me + 1} of ${rows.length}</b> by KeyMove@1 at ` +
      `universe ${esc(S.universe)}. ` + (me === 0
        ? "It leads, but check whether the interval overlaps the runner-up " +
          "before calling that a win."
        : `The leader is <code>${esc(top.name)}</code>; the intervals ` +
          (overlap ? "<b>overlap, so this gap is not significant</b>."
                   : "do not overlap."))));
  }
}

function renderViewPanel(m, data, rk) {
  const exp = data.experiments[S.universe];
  const c = section(m, "Current view — " + policyLabel() + ", lane " + S.lane,
    "slice",
    "Everything in this panel describes the slice you are looking at right " +
    "now. None of it is a statement about ranking quality.");
  let v = null, srcNote = "";
  if (S.policy === "topk") {
    v = exp.views[viewKey()];
    srcNote = `precomputed cell <code>${esc(viewKey())}</code>`;
  } else {
    const cur = sweepCurve(rk), lv = sweepLevels();
    let hit = null;
    if (S.policy === "pct")
      hit = lv.filter(l => l.kind === "percentile")
        .sort((a, b) => Math.abs(a.param * 100 - S.pct) -
                        Math.abs(b.param * 100 - S.pct))[0];
    else if (S.policy === "cluster") hit = lv.find(l => l.kind === "cluster");
    if (cur && hit && cur[hit.id]) {
      v = cur[hit.id];
      srcNote = `from the sweep at <b>${esc(hit.label)}</b>, computed at ` +
        `lane = all (lane selection does not apply to sweep curves)`;
    }
  }
  if (!v) {
    c.appendChild(el("p", "warn-box", S.policy === "global"
      ? "The global score threshold is a cross-proof policy and is not " +
        "precomputed in this build. <b>Cross-proof score comparability has " +
        "never been validated in this program</b>, so this policy is marked " +
        "exploratory and its metrics are deliberately not reported as if " +
        "they were sound."
      : "No precomputed view for this policy."));
    return;
  }
  c.appendChild(el("p", "note", srcNote));
  const rowsT = [
    ["items admitted", intf(v.ViewSize !== undefined ? v.ViewSize : null)],
    ["share of universe admitted", pct(v.ViewSizeFraction, 2)],
    ["proofs covered", intf(v.ViewProofsCovered)],
    ["structural glue share of the view", pct(v.ViewGlueShare)],
  ];
  if (v.ViewKeyRetained)
    rowsT.push(["graded key moves retained",
      typeof v.ViewKeyRetained === "object"
        ? `${pct(v.ViewKeyRetained.value)} <span class="ci">(${v.ViewKeyRetained.k}/${v.ViewKeyRetained.n})</span>`
        : pct(v.ViewKeyRetained)]);
  if (v.ViewPrecisionGraded !== undefined)
    rowsT.push(["precision of the view (graded ≥ SUPPORT)",
                pct(v.ViewPrecisionGraded)]);
  if (v.ViewLaneHidesOfUniverse !== undefined)
    rowsT.push(["hidden by this lane", pct(v.ViewLaneHidesOfUniverse)]);
  table(c, ["property", "value"], rowsT);

  const g = v.graph || v;
  if (g && g.GraphComponents !== undefined) {
    c.appendChild(el("h3", null, "Graph structure of this slice"));
    table(c, ["metric", "value", "meaning"], [
      ["components", intf(g.GraphComponents), "islands in the map at this setting"],
      ["giant fraction", pct(g.GraphGiantFraction),
       "share of nodes in the largest connected piece"],
      ["second largest", intf(g.GraphSecondLargest), "size of the next island"],
      ["entropy", num(g.GraphEntropy, 3), "spread of component sizes"],
      ["susceptibility", num(g.GraphSusceptibility, 2),
       "mean non-giant component size — peaks at a percolation threshold"],
      ["active nodes", pct(g.GraphActiveNodeFraction),
       "share of declarations touched at all"],
    ]);
  }
  if (v.ViewComposition) {
    const host = chartBox(c, "What the slice is made of", null);
    Charts.stacked(host, {
      rows: [{label: policyLabel(), values: v.ViewComposition}],
      parts: CAT_ORDER.map(x => ({name: x, color: CAT_COLOR[x]})),
      yFormat: x => pct(x, 0), legend: true});
  }
}

/* ------------------------------- VIBE ---------------------------------- */
function admittedSet(p, order) {
  // order: [{n, rank, score_pct, ...}] already sorted by rank, lane-filtered
  const nvis = order.length;
  if (S.policy === "global") {
    // a genuine CROSS-PROOF threshold on the ranking's global score order.
    // Unlike the other policies this one can admit nothing at all from a
    // proof, which is the honest behaviour: not every proof contains a
    // globally top-scoring citation.
    const have = order.filter(o => typeof o.score_pct === "number");
    if (!have.length) return null;      // signals "not available" to the caller
    return new Set(have.filter(o => o.score_pct <= S.q / 100).map(o => o.n));
  }
  let cut;
  if (S.policy === "topk") cut = S.k;
  else if (S.policy === "pct") cut = Math.max(1, Math.ceil(S.pct / 100 * nvis));
  else cut = clusterCut(order);
  return new Set(order.slice(0, cut).map(o => o.n));
}
function clusterCut(order) {
  // largest relative gap in the score sequence, floored at 1.
  // Mirrors the shipped policy's default in spirit; the authoritative
  // corpus-wide numbers come from sweep.json, this is the per-proof preview.
  if (order.length <= 1) return order.length;
  const key = o => (o.keys && o.keys.length) ? o.keys : [o.rank];
  const flat = order.map(o => key(o).map(Number));
  const L = Math.max.apply(null, flat.map(a => a.length));
  const dist = (a, b) => {
    for (let i = 0; i < L; i++) {
      const x = a[i] === undefined ? 0 : a[i], y = b[i] === undefined ? 0 : b[i];
      if (x !== y) return Math.abs(y - x) / (Math.abs(x) + Math.abs(y) + 1);
    }
    return 0;
  };
  let best = 1, bestGap = -1;
  for (let i = 0; i < order.length - 1; i++) {
    const g = dist(flat[i], flat[i + 1]);
    if (g > bestGap) { bestGap = g; best = i + 1; }
  }
  return best;
}

function renderVibe(m) {
  const V = D.vibe;
  if (!V) { section(m, "No vibe data in this build"); return; }
  const rk = S.vibeRanking || S.ranking || V.rankings[0];
  S.vibeRanking = rk;

  let c = section(m, "Vibe check — the same 12 proofs, every ranking");
  c.appendChild(el("p", null,
    "One fixed, seeded, depth-stratified set of 12 proofs, identical for " +
    "every ranking experiment, so you can toggle between rankings and see " +
    "the ordering move on the same material. Depths span " +
    esc(V.proofs[0].theorem_depth) + " to " +
    esc(V.proofs[V.proofs.length - 1].theorem_depth) + "."));
  const sel = el("div", "vibectl");
  sel.appendChild(el("span", "chiplabel", "Ranking:"));
  for (const n of V.rankings) {
    const b = el("button", "chip" + (n === rk ? " on" : ""), esc(n));
    b.onclick = () => { S.vibeRanking = n; render(); };
    sel.appendChild(b);
  }
  c.appendChild(sel);
  c.appendChild(el("p", "warn-box",
    "<b>Two kinds of text below, never mixed.</b> " +
    "<span class='pill grade'>reviewer grade</span> is a blind rater " +
    "judgement and IS the experiment's ground truth. " +
    "<span class='pill llm'>LLM gloss</span> is an English explanation " +
    "generated afterwards purely so you can read the Lean; it feeds no " +
    "metric, no label and no outcome."));
  const leg = el("div", "legend");
  leg.innerHTML =
    `<span class="sw admitted"></span> admitted by the current policy ` +
    `<span class="sw hidden-l"></span> hidden by the lane ` +
    `<span class="sw excluded"></span> ranked below the cut`;
  c.appendChild(leg);

  for (const p of V.proofs) {
    const card = el("section", "card proof");
    const h = el("div", "cardhead");
    h.appendChild(el("h2", null, `<code>${esc(p.theorem)}</code>`));
    h.appendChild(el("span", "badge",
      `depth ${p.theorem_depth} · band ${esc(p.band)} · ` +
      `${p.candidates.length} candidates`));
    card.appendChild(h);

    if (p.statement_en_llm) {
      const b = el("div", "llm");
      b.appendChild(el("span", "pill llm", "LLM gloss — not used by any metric"));
      b.appendChild(el("p", null, "<b>What it says.</b> " +
        esc(p.statement_en_llm)));
      if (p.proof_sketch_en_llm)
        b.appendChild(el("p", null, "<b>How the proof goes.</b> " +
          esc(p.proof_sketch_en_llm)));
      card.appendChild(b);
    }
    if ((p.missing_key_votes || []).some(Boolean))
      card.appendChild(el("p", "warn-box",
        "A rater judged that this proof's real key move is <b>not in the " +
        "candidate list at all</b> — a coverage gap, not a ranking failure."));

    const ord = p.orders[S.universe + "|" + rk] || {};
    const inLane = cd => (cd.lanes || []).indexOf(S.lane) >= 0;
    const visible = p.candidates.filter(inLane).map(cd => ({
      n: cd.n, rank: (ord[cd.n] || {}).rank,
      keys: (ord[cd.n] || {}).keys,
      score_pct: (ord[cd.n] || {}).score_pct, cd}))
      .filter(o => o.rank !== null && o.rank !== undefined)
      .sort((a, b) => a.rank - b.rank);
    const admRaw = admittedSet(p, visible);
    const adm = admRaw || new Set();
    if (admRaw === null && !card.querySelector(".nopolicy"))
      card.appendChild(el("p", "warn-box nopolicy",
        "Global score percentiles are not present in this build, so nothing " +
        "is highlighted for this policy. Highlighting is deliberately left " +
        "off rather than substituted with a per-proof percentile, which " +
        "would be a different policy wearing the same name."));

    const all = p.candidates.map(cd => ({
      n: cd.n, cd, inLane: inLane(cd),
      rank: (ord[cd.n] || {}).rank, keys: (ord[cd.n] || {}).keys}));
    const visRank = new Map(visible.map((o, i) => [o.n, i + 1]));
    all.sort((a, b) => {
      const ra = visRank.has(a.n) ? visRank.get(a.n) : 1e9;
      const rb = visRank.has(b.n) ? visRank.get(b.n) : 1e9;
      return ra - rb || a.n - b.n;
    });
    for (const o of all) o.score_pct = (ord[o.n] || {}).score_pct;

    const t = el("table", "cands");
    t.innerHTML =
      "<thead><tr><th>#</th><th>score keys</th><th>global %ile</th>" +
      "<th>declaration</th>" +
      "<th>kind</th><th>cited d</th><th>role</th><th>origin</th>" +
      "<th>reviewer grade</th><th>source-cited</th><th>our class</th>" +
      "</tr></thead>";
    const tb = el("tbody");
    for (const o of all) {
      const cd = o.cd;
      const cls = !o.inLane ? "hidden-l"
        : (adm.has(o.n) ? "admitted" : "excluded");
      const tr = el("tr", cls);
      const gname = cd.grade_name;
      tr.innerHTML =
        `<td class="rk">${o.inLane && visRank.has(o.n) ? visRank.get(o.n) : "—"}</td>` +
        `<td class="keys">${o.keys ? esc(JSON.stringify(o.keys)) : "—"}</td>` +
        `<td>${typeof o.score_pct === "number" ? pct(o.score_pct, 2) : "—"}</td>` +
        `<td><code>${esc(cd.name)}</code></td>` +
        `<td>${esc(cd.kind)}</td>` +
        `<td>${cd.cited_depth}</td>` +
        `<td>${esc(cd.role)}</td>` +
        `<td>${cd.in_statement ? "in-statement" : "<b>introduced</b>"}</td>` +
        `<td>${gname ? `<span class="gr" style="background:${GRADE_COLOR[gname]}">${esc(gname)}</span>` : "—"}</td>` +
        `<td>${cd.source_cited === null ? "<span class=ci>no provenance</span>"
             : (cd.source_cited ? "yes" : "no")}</td>` +
        `<td>${esc(cd.system_category)}${cd.system_glue ? " <b>(glue)</b>" : ""}</td>`;
      tb.appendChild(tr);
      if (cd.explanation_llm) {
        const tr2 = el("tr", "expl " + cls);
        tr2.innerHTML = `<td></td><td colspan="10"><span class="pill llm">gloss</span> ` +
          esc(cd.explanation_llm) + "</td>";
        tb.appendChild(tr2);
      }
    }
    t.appendChild(tb);
    card.appendChild(t);
    card.appendChild(el("p", "note",
      `Target depth ${p.theorem_depth}. ` +
      `${Math.round(100 * p.def_fraction)}% of candidates are ` +
      `definitions/constructions. ` +
      (p.has_provenance ? "Author provenance available."
        : "No author provenance for this proof, so the source-cited column " +
          "is blank rather than false.")));
    m.appendChild(card);
  }
}

/* ================================= boot ================================= */
/* Remember where you were. Every value is validated against the manifest
   before use, so a stored state from an older build cannot wedge the page on
   a tab or ranking that no longer exists. */
const STORE = "mathmap.viewer.state.v1";
function saveState() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
}
function restoreState() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); }
  catch (e) { return; }
  if (!saved) return;
  const names = D.manifest.rankings.map(r => r.name);
  const ok = {
    universe: v => D.manifest.universes.indexOf(v) >= 0,
    lane: v => D.manifest.lanes.indexOf(v) >= 0,
    tab: v => ["howto", "summary", "vibe", "ranking"].indexOf(v) >= 0,
    ranking: v => names.indexOf(v) >= 0,
    vibeRanking: v => names.indexOf(v) >= 0,
    policy: v => ["topk", "pct", "global", "cluster"].indexOf(v) >= 0,
    k: v => Number.isInteger(v) && v >= 1 && v <= 12,
    pct: v => Number.isFinite(v) && v >= 1 && v <= 100,
    q: v => Number.isFinite(v) && v >= 1 && v <= 100,
  };
  for (const [k, valid] of Object.entries(ok))
    if (saved[k] !== undefined && saved[k] !== null && valid(saved[k]))
      S[k] = saved[k];
}

function boot() {
  restoreState();
  S.universe = S.universe || D.manifest.reference_universe;
  S.ranking = S.ranking ||
    (D.manifest.rankings.find(r => r.family === "candidate") ||
     D.manifest.rankings[0]).name;
  S.lane = D.manifest.lanes.indexOf(S.lane) >= 0 ? S.lane : D.manifest.lanes[0];
  wireControls();
  render();
}

// expose the render entry points so the page can be driven from the console
// and by the headless render test
window.render = render;
window.boot = boot;

(async () => {
  if (await loadData()) boot();
  else wirePicker();
})();
</script>
